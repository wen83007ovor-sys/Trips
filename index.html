<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MyTrip 旅遊行程</title>

    <!-- 部署新版本時，把下面所有 ?v=20260916000613 的數字改成新的版本號，
         瀏覽器就會強制重新抓取最新的 CSS/JS，不會停留在舊快取。 -->
    <link rel="stylesheet" href="css/tokens.css?v=20260916000613">
    <link rel="stylesheet" href="css/base.css?v=20260916000613">
    <link rel="stylesheet" href="css/forms.css?v=20260916000613">
    <link rel="stylesheet" href="css/itinerary.css?v=20260916000613">
    <link rel="stylesheet" href="css/fab.css?v=20260916000613">
    <link rel="stylesheet" href="css/responsive.css?v=20260916000613">
    <link rel="stylesheet" href="css/print.css?v=20260916000613">
</head>
<body>

    <div class="lang-switch no-print">
        <div class="brand-logo">My Trips</div>
        <select id="langSelect" data-action="change-lang">
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container" id="pdfArea">
        <div class="company-header"><input type="text" id="ipt_agency" data-ph="ph_agency" placeholder="輸入旅行社名稱"></div>
        <h1 data-i18n="title">旅遊行程</h1>

        <div class="form-section">
            <div class="form-group"><label data-i18n="client">客戶名稱：</label><input type="text" id="ipt_company"></div>
            <div class="form-group"><label data-i18n="contact">聯絡窗口：</label><input type="text" id="ipt_contact"></div>
            <div class="form-group"><label data-i18n="phone">聯絡電話：</label><input type="text" id="ipt_phone"></div>
            <div class="form-group"><label data-i18n="date">出發日期：</label><input type="date" id="ipt_date"></div>
            <div class="form-group"><label data-i18n="days">行程天數：</label><input type="number" id="ipt_days" value="3"></div>
            <div class="form-group"><label data-i18n="meetup">集合地點：</label><input type="text" id="ipt_meetup"></div>
        </div>

        <div id="itineraryContainer">
            <p style="text-align: center; color: #999; padding: 50px;" class="no-print" data-i18n="click_hint">請點擊「1. 行程」</p>
        </div>

        <table class="cost-table" style="margin-top: 40px;">
            <tr><th data-i18n="c1_label">個人團費</th><td><input type="text" id="ipt_c1" data-ph="c1_ph" placeholder="$ /人"></td></tr>
            <tr><th data-i18n="c2_label">交通</th><td><input type="text" id="ipt_c2" data-ph="c2_ph" placeholder="交通說明: 車資/機票"></td></tr>
            <tr><th data-i18n="c3_label">餐食</th><td><input type="text" id="ipt_c3" data-ph="c3_ph" placeholder="早午晚餐說明"></td></tr>
            <tr><th data-i18n="c4_label">住宿</th><td><input type="text" id="ipt_c4" data-ph="c4_ph" placeholder="飯店名稱與房型"></td></tr>
            <tr><th data-i18n="c5_label">費用包含</th><td><input type="text" id="ipt_c5" data-ph="c5_ph" placeholder="門票保險等"></td></tr>
        </table>
    </div>

    <!-- 懸浮按鈕 -->
    <div class="fab-container no-print" id="fabContainer">
        <!-- 編輯模式選單 -->
        <div id="group-edit" class="fab-menu">
            <div class="fab-row"><span class="fab-label" data-i18n="btn_view">2.預覽</span><button class="btn btn-edit-preview" data-action="preview">👁️</button></div>
            <div class="fab-row"><span class="fab-label" data-i18n="btn_gen">1.行程</span><button class="btn btn-edit-gen" data-action="build">📝</button></div>
            <div class="fab-row"><span class="fab-label" data-i18n="btn_load">讀檔</span><button class="btn btn-edit-load" data-action="load">📂</button></div>
            <div class="fab-row"><span class="fab-label" data-i18n="btn_save">存檔</span><button class="btn btn-edit-save" data-action="save">💾</button></div>
        </div>
        <!-- 預覽模式選單 -->
        <div id="group-preview" class="fab-menu hidden">
            <div class="fab-row"><span class="fab-label" data-i18n="btn_word">下載Word</span><button class="btn btn-pre-word" data-action="export-word">📄</button></div>
            <div class="fab-row"><span class="fab-label" data-i18n="btn_pdf">下載PDF</span><button class="btn btn-pre-pdf" data-action="export-pdf">📥</button></div>
            <div class="fab-row"><span class="fab-label" data-i18n="btn_back">返回編輯</span><button class="btn btn-pre-back" data-action="edit">⬅</button></div>
        </div>
        <!-- 主按鈕 (展開/收合) -->
        <button class="fab-main" id="fabMain" data-action="toggle-fab">☰</button>
    </div>

    <script type="module" src="js/main.js?v=20260916000613"></script>
</body>
</html>
